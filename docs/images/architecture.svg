<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Top Title Bar -->
  <rect x="40" y="24" width="1120" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="70" y="60" fill="#0f172a" font-size="20" font-weight="700" letter-spacing="0.3">KEDA Kubernetes Event-Driven Autoscaling Architecture Blueprint</text>
  <rect x="870" y="40" width="130" height="26" rx="13" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="883" y="58" fill="#b91c1c" font-size="11" font-weight="700">SCALE TO ZERO</text>
  <rect x="1010" y="40" width="130" height="26" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="1024" y="58" fill="#1d4ed8" font-size="11" font-weight="700">EVENT DRIVEN</text>

  <!-- COLUMN 1: Event Sources & Scalers -->
  <rect x="40" y="110" width="340" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="40" y="110" width="340" height="40" rx="8" fill="#f1f5f9"/>
  <text x="60" y="136" fill="#0284c7" font-size="13" font-weight="700">1. EVENT SOURCES &amp; QUEUES</text>

  <rect x="60" y="165" width="300" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="192" fill="#0f172a" font-size="14" font-weight="600">AWS SQS Event Stream</text>
  <text x="75" y="214" fill="#64748b" font-size="11">Queue: `ingestion-queue` • Target: 10 msg/pod</text>
  <text x="75" y="234" fill="#0284c7" font-size="10" font-weight="600">Metric: ApproximateNumberOfMessages</text>
  <text x="75" y="248" fill="#475569" font-size="10">Deep integration via AWS EKS Pod Identity / IRSA</text>

  <rect x="60" y="275" width="300" height="95" rx="6" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1"/>
  <text x="75" y="302" fill="#1d4ed8" font-size="13" font-weight="600">Redis In-Memory Queue</text>
  <text x="75" y="324" fill="#475569" font-size="11">List: `task_queue` • Target: 20 msg/pod</text>
  <text x="75" y="344" fill="#475569" font-size="11">Direct LLEN command polling via Redis protocol</text>
  <text x="75" y="360" fill="#16a34a" font-size="10" font-weight="600">Sub-second queue depth monitoring</text>

  <rect x="60" y="385" width="300" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="412" fill="#0f172a" font-size="13" font-weight="600">TriggerAuthentication CRD</text>
  <rect x="75" y="426" width="135" height="24" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="85" y="442" fill="#1d4ed8" font-size="10" font-weight="600">Zero Secret Hardcoding</text>
  <text x="75" y="470" fill="#64748b" font-size="11">Decoupled security credentials &amp; IAM roles</text>

  <rect x="60" y="495" width="300" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="522" fill="#0f172a" font-size="13" font-weight="600">Fallback &amp; Circuit Breaker</text>
  <text x="75" y="545" fill="#475569" font-size="11">• Failure threshold: 3 consecutive checks</text>
  <text x="75" y="565" fill="#475569" font-size="11">• Fallback replicas: 5 safe default workers</text>

  <!-- COLUMN 2: KEDA Controller & Metrics Engine -->
  <rect x="410" y="110" width="370" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="410" y="110" width="370" height="40" rx="8" fill="#f1f5f9"/>
  <text x="430" y="136" fill="#dc2626" font-size="13" font-weight="700">2. KEDA CONTROLLER &amp; METRICS SERVER</text>

  <rect x="430" y="165" width="330" height="90" rx="6" fill="#f8fafc" stroke="#fca5a5" stroke-width="1"/>
  <text x="445" y="192" fill="#b91c1c" font-size="13" font-weight="600">KEDA Operator (Scale-to-Zero Loop)</text>
  <text x="445" y="214" fill="#475569" font-size="11">Polls external triggers every 10–15s</text>
  <text x="445" y="234" fill="#16a34a" font-size="10" font-weight="600">Scales Deployment from 0 to 1 on first message</text>
  <text x="445" y="248" fill="#64748b" font-size="10">De-activates HPA when queue is empty</text>

  <rect x="430" y="270" width="330" height="105" rx="6" fill="#f8fafc" stroke="#fed7aa" stroke-width="1"/>
  <text x="445" y="297" fill="#c2410c" font-size="13" font-weight="600">External Metrics API Server</text>
  <text x="445" y="320" fill="#15803d" font-size="11" font-weight="600">• Converts queue length into custom metrics</text>
  <text x="445" y="340" fill="#15803d" font-size="11" font-weight="600">• Hands off scaling math to Kubernetes HPA</text>
  <text x="445" y="360" fill="#475569" font-size="11">• Eliminates latency in high-throughput traffic</text>

  <rect x="430" y="390" width="330" height="95" rx="6" fill="#f8fafc" stroke="#fed7aa" stroke-width="1"/>
  <text x="445" y="417" fill="#c2410c" font-size="13" font-weight="600">Stabilization Windows &amp; Behaviors</text>
  <text x="445" y="440" fill="#15803d" font-size="11" font-weight="600">• scaleUp: 0s stabilization (instant burst)</text>
  <text x="445" y="460" fill="#475569" font-size="11">• scaleDown: 300s window (prevents flapping)</text>
  <text x="445" y="478" fill="#b91c1c" font-size="10" font-weight="600">Smooth elastic scaling curves</text>

  <rect x="430" y="500" width="330" height="80" rx="6" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1"/>
  <text x="445" y="527" fill="#4338ca" font-size="13" font-weight="600">Prometheus Telemetry Instrumentation</text>
  <text x="445" y="549" fill="#475569" font-size="11">• `keda_scaler_metric_value` per ScaledObject</text>
  <text x="445" y="569" fill="#475569" font-size="11">• Alerting on lag accumulation &amp; consumer stalls</text>

  <!-- COLUMN 3: Autoscaled Workloads -->
  <rect x="810" y="110" width="350" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="810" y="110" width="350" height="40" rx="8" fill="#f1f5f9"/>
  <text x="830" y="136" fill="#059669" font-size="13" font-weight="700">3. AUTOSCALED WORKLOAD TARGETS</text>

  <rect x="830" y="165" width="310" height="95" rx="6" fill="#f8fafc" stroke="#a7f3d0" stroke-width="1"/>
  <text x="845" y="192" fill="#065f46" font-size="13" font-weight="600">Continuous Consumer Deployments</text>
  <text x="845" y="214" fill="#475569" font-size="11">• Min Replicas: 0 (Scale-to-Zero cost save)</text>
  <text x="845" y="234" fill="#059669" font-size="10" font-weight="600">Max Replicas: 50 elastic worker pods</text>
  <text x="845" y="250" fill="#475569" font-size="10">Target: queue-worker-deployment</text>

  <rect x="830" y="275" width="310" height="95" rx="6" fill="#f8fafc" stroke="#bae6fd" stroke-width="1"/>
  <text x="845" y="302" fill="#0369a1" font-size="13" font-weight="600">ScaledJob Batch Execution</text>
  <text x="845" y="325" fill="#475569" font-size="11">• Spawns isolated batch Kubernetes Jobs</text>
  <text x="845" y="345" fill="#475569" font-size="11">• Run-to-completion processing paradigm</text>
  <text x="845" y="362" fill="#475569" font-size="11">• Ideal for long-running transcoding / ML jobs</text>

  <rect x="830" y="385" width="310" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="845" y="412" fill="#0f172a" font-size="13" font-weight="600">Graceful Termination &amp; Draining</text>
  <text x="845" y="435" fill="#475569" font-size="11">• terminationGracePeriodSeconds: 60s</text>
  <text x="845" y="455" fill="#475569" font-size="11">• SIGTERM handler completes in-flight tasks</text>
  <text x="845" y="472" fill="#475569" font-size="11">• Zero dropped messages during scale-in</text>

  <rect x="830" y="495" width="310" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="845" y="522" fill="#0f172a" font-size="13" font-weight="600">FinOps Cloud Cost Optimization</text>
  <text x="845" y="545" fill="#475569" font-size="11">• 70%+ EC2 / node compute cost reduction</text>
  <text x="845" y="565" fill="#475569" font-size="11">• Cluster Autoscaler / Karpenter node spin-down</text>
</svg>